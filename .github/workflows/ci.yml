name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.7']
        include:
          - os: ubuntu-latest
            go: '1.22.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 1.22's Mach-O test binaries may lack LC_UUID on macOS 26.
          # Keep minimum-version coverage on Linux; test all OSes on a newer linker.
          go-version: ${{ matrix.go }}
          cache: false # stdlib-only module has no go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/mdx
